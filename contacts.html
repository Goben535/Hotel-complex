<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
        <header class="header">
    <div class="container">
        <div class="logo">
            <span class="logo-text" id="logo"></span>
        </div>
        <input type="checkbox" id="burger-toggle" class="burger-checkbox">
        <nav class="nav"><ul id="nav"></ul></nav>
        <div class="contact-info">
            <span id="phone"></span>
        </div>
        <label for="burger-toggle" class="burger-btn">
            <span></span>
            <span></span>
            <span></span>
        </label>
    </div>
</header>

    <main class="container">
        <section class="section-h2">
            <h1 id="title-contacts">Контакты</h1>
            <p id="desc-contacts"></p>
        </section>

        <div class="grid contacts">
            <div class="card">
                <h2>Контактная информация</h2>
                <div class="item">
                    <div>
                        <strong>Наш адрес</strong>
                        <p id="addr-info"></p>
                    </div>
                </div>
                <div class="item">
                    <div>
                        <strong>Телефоны</strong>
                        <p id="phone-info"></p>
                    </div>
                </div>
                <div class="item">
                    <div>
                        <strong>Email</strong>
                        <p id="email-info"></p>
                    </div>
                </div>
            </div>

            <form class="form" id="form-msg">
                <h2>Написать сообщение</h2>
                <div class="row">
                    <div class="group">
                        <label>Ваше имя</label>
                        <input type="text" name="name">
                    </div>
                    <div class="group">
                        <label>Телефон</label>
                        <input type="tel" name="phone">
                    </div>
                </div>
                <div class="group">
                    <label>Email</label>
                    <input type="email" name="email">
                </div>
                <div class="group">
                    <label>Сообщение</label>
                    <textarea name="message" rows="5"></textarea>
                </div>
                <button type="submit" class="btn">Отправить сообщение</button>
            </form>
        </div>
    </main>

  <footer class="footer">
        <div class="container footer-grid">
            <div class="col">
                <h3 id="logo-footer">Гостиничный комплекс</h3>
                <p id="desc-footer" class="text"></p>
            </div>
            <div class="col">
                <h4>Навигация</h4>
                <ul id="nav-footer"></ul>
            </div>
            <div class="col">
                <h4>Контакты</h4>
                <p id="addr-footer" class="text"></p>
                <p id="phone-footer" class="text"></p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
